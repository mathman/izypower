<div class="eqLogic eqLogic-widget allowResize izy-meter #eqLogic_class# #class#"
     data-eqLogic_id="#id#"
     data-eqLogic_uid="#uid#"
     data-version="#version#"
     style="width:#width#;height:#height#;#style#">
  <style>
    .izy-meter{
      box-sizing:border-box; overflow:auto; padding:12px !important; border-radius:10px;
      background:rgba(120,120,120,.05);
    }
    .izy-meter .izy-name{
      display:block; text-align:center; color:inherit; text-decoration:none !important;
      font-size:14px; font-weight:700; margin-bottom:6px; white-space:normal; word-break:break-word;
    }
    .izy-meter .izy-name:hover{ text-decoration:underline !important; }

    .izy-meter .izy-badge{
      display:flex; align-items:center; justify-content:center; gap:6px;
      font-size:11px; font-weight:700; padding:4px 10px; border-radius:12px;
      width:fit-content; margin:0 auto 10px auto;
    }
    .izy-meter .izy-online{ background:rgba(40,167,69,.15); color:#28a745; }
    .izy-meter .izy-offline{ background:rgba(220,53,69,.15); color:#dc3545; }
    .izy-meter .izy-dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }

    .izy-meter .izy-total{ text-align:center; margin-bottom:10px; }
    .izy-meter .izy-total-value{ font-size:22px; font-weight:800; }
    .izy-meter .izy-total-label{ font-size:10px; opacity:.7; }

    .izy-meter .izy-grid{
      display:grid; grid-template-columns:1fr 1fr; gap:4px 8px; font-size:11px; margin-bottom:8px;
    }
    .izy-meter .izy-k{ opacity:.75; }
    .izy-meter .izy-v{ font-weight:600; text-align:right; white-space:normal; word-break:break-word; }

    .izy-meter .izy-footer{
      font-size:10px; opacity:.6; text-align:center; border-top:1px solid rgba(120,120,120,.2); padding-top:6px;
    }
  </style>

  <a href="index.php?v=d&m=izypower&p=izypower&id=#id#" class="izy-name" title="#name_display#">#name_display#</a>

  <div class="izy-badge #online_class# #online_state_history_class#" data-cmd_id="#online_state_id#"><span class="izy-dot"></span>#online_label#</div>

  <div class="izy-total">
    <div class="izy-total-value #meter_power_history_class#" data-cmd_id="#meter_power_id#">⚡ #meter_power# W</div>
    <div class="izy-total-label">Puissance réseau</div>
  </div>

  <div class="izy-grid">
    <div class="izy-k">🔌 Tension</div>
    <div class="izy-v #meter_voltage_history_class#" data-cmd_id="#meter_voltage_id#">#meter_voltage# V</div>

    <div class="izy-k">〰️ Fréquence</div>
    <div class="izy-v #meter_frequency_history_class#" data-cmd_id="#meter_frequency_id#">#meter_frequency# Hz</div>

    <div class="izy-k">⬇️ Énergie importée</div>
    <div class="izy-v #meter_energy_p_history_class#" data-cmd_id="#meter_energy_p_id#">#meter_energy_p# kWh</div>

    <div class="izy-k">⬆️ Énergie exportée</div>
    <div class="izy-v #meter_energy_n_history_class#" data-cmd_id="#meter_energy_n_id#">#meter_energy_n# kWh</div>

    <div class="izy-k">📶 Wi-Fi</div>
    <div class="izy-v #wifi_signal_history_class#" data-cmd_id="#wifi_signal_id#">#wifi_signal# dBm</div>

    <div class="izy-k">📡 Réseau</div>
    <div class="izy-v #wifi_network_history_class#" data-cmd_id="#wifi_network_id#">#wifi_network#</div>
  </div>

  <div class="izy-footer #ip_address_history_class#" data-cmd_id="#ip_address_id#">#ip_address# · v#software_version#</div>
</div>
