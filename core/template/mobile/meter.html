<div class="eqLogic eqLogic-widget izy-meter-m #eqLogic_class# #class#"
     data-eqLogic_id="#id#"
     data-eqLogic_uid="#uid#"
     data-version="#version#">
  <style>
    .izy-meter-m{
      width:100% !important; box-sizing:border-box; padding:12px !important; border-radius:10px;
      background:rgba(120,120,120,.05);
    }
    .izy-meter-m .izy-name{
      display:block; text-align:center; color:inherit; text-decoration:none !important;
      font-size:16px; font-weight:700; margin-bottom:8px;
    }
    .izy-meter-m .izy-badge{
      display:flex; align-items:center; justify-content:center; gap:6px;
      font-size:12px; font-weight:700; padding:6px 12px; border-radius:14px;
      width:fit-content; margin:0 auto 12px auto;
    }
    .izy-meter-m .izy-online{ background:rgba(40,167,69,.15); color:#28a745; }
    .izy-meter-m .izy-offline{ background:rgba(220,53,69,.15); color:#dc3545; }
    .izy-meter-m .izy-dot{ width:8px; height:8px; border-radius:50%; background:currentColor; }

    .izy-meter-m .izy-total{ text-align:center; margin-bottom:12px; }
    .izy-meter-m .izy-total-value{ font-size:26px; font-weight:800; }
    .izy-meter-m .izy-total-label{ font-size:11px; opacity:.7; }

    .izy-meter-m .izy-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; font-size:13px; margin-bottom:8px; }
    .izy-meter-m .izy-k{ opacity:.75; }
    .izy-meter-m .izy-v{ font-weight:600; text-align:right; }

    .izy-meter-m .izy-footer{
      font-size:11px; opacity:.6; text-align:center; border-top:1px solid rgba(120,120,120,.2); padding-top:8px;
    }
  </style>

  <a href="index.php?v=d&m=izypower&p=izypower&id=#id#" class="izy-name" title="#name_display#">#name_display#</a>

  <div class="izy-badge #online_class# #online_state_history_class#" data-cmd_id="#online_state_id#"><span class="izy-dot"></span>#online_label#</div>

  <div class="izy-total">
    <div class="izy-total-value #meter_power_history_class#" data-cmd_id="#meter_power_id#">⚡ #meter_power# W</div>
    <div class="izy-total-label">Puissance réseau</div>
  </div>

  <div class="izy-grid">
    <div class="izy-k">🔌 Tension</div>
    <div class="izy-v #meter_voltage_history_class#" data-cmd_id="#meter_voltage_id#">#meter_voltage# V</div>

    <div class="izy-k">〰️ Fréquence</div>
    <div class="izy-v #meter_frequency_history_class#" data-cmd_id="#meter_frequency_id#">#meter_frequency# Hz</div>

    <div class="izy-k">⬇️ Import</div>
    <div class="izy-v #meter_energy_p_history_class#" data-cmd_id="#meter_energy_p_id#">#meter_energy_p# kWh</div>

    <div class="izy-k">⬆️ Export</div>
    <div class="izy-v #meter_energy_n_history_class#" data-cmd_id="#meter_energy_n_id#">#meter_energy_n# kWh</div>
  </div>

  <div class="izy-footer #ip_address_history_class#" data-cmd_id="#ip_address_id#">#ip_address# · v#software_version#</div>
</div>
